[workspace]
resolver = "2"
members = ["core", "crawler", "server"]
exclude = ["frontend"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Async / runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# HTTP
reqwest = { version = "0.12", features = ["blocking"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }

# Crawler
governor = "0.6"
scraper = "0.23"
robotstxt = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
url = "2"
anyhow = "1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
